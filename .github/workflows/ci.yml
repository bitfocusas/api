name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # No lockfile is committed, so a scheduled run catches breakage from newly published dependency versions
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - name: Run tests
        run: yarn test:coverage
      - name: Build
        run: yarn build
      - name: Smoke test built package
        run: yarn test:dist
