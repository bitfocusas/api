name: Publish

# Publishes to npm when a GitHub release is published (release-it creates the release).
# Uses npm trusted publishing (OIDC): no npm token is stored, and provenance is generated automatically.
on:
  release:
    types: [published]

# Nothing is granted by default; each job asks for only what it needs
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Installs dependencies and runs their scripts, so it gets no publishing rights
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache when building a release, to avoid cache poisoning
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn test:dist

      - name: Pack
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  # The only job that can mint an npm publishing token. It runs no project or dependency code:
  # no checkout, no install, no scripts - it publishes the tarball built above.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured as the trusted publisher on npm.
    # Add protection rules (e.g. required reviewers, tag restrictions) to it in the repo settings.
    environment: npm
    permissions:
      id-token: write # required to mint the OIDC token for npm trusted publishing
    steps:
      # Trusted publishing needs npm >= 11.5.1, which ships with current Node 24 releases
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: package

      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG=latest
          if [ "$PRERELEASE" = "true" ]; then TAG=next; fi
          npm publish ./*.tgz --ignore-scripts --tag "$TAG"
